<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show, Don't Tell</title>
<meta name="description" content="A Grade 5 bank of 200 similes and metaphors, sorted by feeling, with Swedish, Simplified Chinese, and Korean support.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<style>
:root{
  --canvas:#92CEFB; --ink:#0E4686; --line:#1A1A1A; --block:#FFFDF7; --text:#1A1A1A;
  --blue:#42A5F5; --green:#35C86F; --yellow:#FFD629; --orange:#FF7A2E; --pink:#F6429A;
  --display:"Arial Black","Arial Bold",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:Aptos,Arial,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--body);font-size:20px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* blocks: square corners, 3px outline, hard shadow */
.blk{background:var(--block);border:3px solid var(--line);box-shadow:6px 6px 0 var(--line)}
.btn{background:var(--block);color:var(--text);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:0;padding:10px 16px;font-weight:700;transition:transform .06s,box-shadow .06s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

/* header */
header{background:var(--ink);color:#fff;border-bottom:8px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.title{margin:0;font-family:var(--display);font-size:clamp(30px,5vw,48px);letter-spacing:.5px;line-height:1.05;text-transform:uppercase}
.title a{color:#fff;text-decoration:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lang{padding:8px 12px;font-size:17px}
.lang[aria-pressed="true"]{background:var(--yellow)}
.sound{font-size:22px;padding:6px 12px}

main{padding:28px 0 40px}

/* intro */
.intro{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px;margin-bottom:34px}
.intro .blk{padding:18px 20px}
.big{font-size:26px;font-weight:700;margin:0}
.def b{font-family:var(--display);font-weight:900}
.tr{color:#1A1A1A;margin-top:8px;padding-top:8px;border-top:3px dashed var(--line);font-size:19px}
.surprise{margin-top:14px;background:var(--yellow)}

/* families */
.fam{margin:0 0 34px}
.tab{display:inline-block;border:3px solid var(--line);border-bottom:0;padding:6px 14px;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.5px}
.tab .trs{font-family:var(--body);font-weight:700;text-transform:none;letter-spacing:0;margin-left:8px}
.fam .blk{padding:18px;display:flex;flex-wrap:wrap;gap:14px}
.feel{display:flex;flex-direction:column;align-items:center;min-width:150px;padding:12px 16px;font-size:22px}
.feel .e{font-size:38px;line-height:1.1}
.feel .w{font-weight:800}
.feel .wt{font-size:17px;font-weight:700;margin-top:2px}
.feel:hover{background:var(--hover,var(--yellow))}

/* feeling view */
.top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.hero{padding:22px 24px;display:flex;align-items:center;gap:22px;margin-bottom:26px}
.hero .e{font-size:84px;line-height:1}
.hero .lead{font-size:22px;font-weight:700}
.hero h2{margin:2px 0 0;font-family:var(--display);font-size:clamp(40px,7vw,68px);line-height:1;text-transform:lowercase}
.hero .ht{font-size:24px;font-weight:700;margin-top:6px}
.ts{display:grid;grid-template-columns:1fr 1.6fr;gap:22px;margin-bottom:30px}
.ts .blk{padding:16px 18px}
.ts .lab{font-family:var(--display);text-transform:uppercase;font-size:16px;margin-bottom:6px}
.ts .line{font-size:23px;font-weight:700}
.tell{background:#E9E9E9}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{padding:16px 18px 18px;position:relative}
.card.flash{animation:flash 1.6s ease-out 2}
@keyframes flash{0%{background:var(--yellow)}100%{background:var(--block)}}
.chip{display:inline-block;border:3px solid var(--line);padding:2px 10px;font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.chip.simile{background:var(--blue)}
.chip.metaphor{background:var(--yellow)}
.phrase{font-size:25px;font-weight:800;line-height:1.25;margin:0 0 8px;padding-right:44px}
.mean{font-size:19px}
.copy{position:absolute;top:12px;right:12px;padding:4px 8px;font-size:18px;box-shadow:3px 3px 0 var(--line)}
.tbox{margin-top:12px;border-top:3px dashed var(--line);padding-top:10px}
.tbox .tp{font-weight:800;font-size:22px}
.tbox .tm{font-size:19px}
.fresh{margin-top:32px;padding:16px 20px;background:var(--green)}
.fresh .big{font-size:22px}

footer{border-top:6px solid var(--line);background:var(--block);font-size:16px}
footer .wrap{padding:16px 20px}
footer a{color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px 18px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

:lang(zh) {font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
:lang(ko) {font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif}

@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .ts{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:18px}
  .wrap{padding:0 16px}
  .feel{min-width:calc(50% - 7px);flex:1 1 calc(50% - 7px)}
  .hero{flex-direction:column;align-items:flex-start}
  .cards{grid-template-columns:1fr}
  .phrase{font-size:22px}
  .lang{font-size:15px;padding:6px 10px}
  .top{gap:10px}
  .top .btn{font-size:17px;padding:8px 12px}
  .hero .e{font-size:60px}
  .hero{gap:10px}
}
@media (prefers-reduced-motion:reduce){.btn,.card.flash{transition:none;animation:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="title"><a href="#" id="home">✏️ Show, Don't Tell</a></h1>
    <div class="tools" role="group" aria-label="Language and sound">
      <button class="btn lang" data-lang="en" aria-pressed="true">English</button>
      <button class="btn lang" data-lang="sv" aria-pressed="false" lang="sv">Svenska</button>
      <button class="btn lang" data-lang="zh" aria-pressed="false" lang="zh">简体中文</button>
      <button class="btn lang" data-lang="ko" aria-pressed="false" lang="ko">한국어</button>
      <button class="btn sound" id="sound" aria-label="Sound on">🔊</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">
  🎹 Piano: <a href="https://sfzinstruments.github.io/pianos/salamander/" target="_blank" rel="noopener">Salamander Grand Piano</a> by Alexander Holm, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>.
  🌏 Translations were written with AI help. If a translation sounds wrong, tell your teacher so we can fix it.
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = {"families":[{"id":"happy","emoji":"😀","color":"#FFD629","en":"Happy feelings","sv":"Glada känslor","zh":"快乐的感受","ko":"기쁜 감정","feelings":["happy","excited","playful","proud","lucky"]},{"id":"sad","emoji":"😢","color":"#42A5F5","en":"Sad feelings","sv":"Ledsna känslor","zh":"难过的感受","ko":"슬픈 감정","feelings":["sad","lonely","disappointed"]},{"id":"angry","emoji":"😡","color":"#FF7A2E","en":"Angry feelings","sv":"Arga känslor","zh":"生气的感受","ko":"화난 감정","feelings":["angry","frustrated"]},{"id":"scared","emoji":"😨","color":"#F6429A","en":"Scared and worried feelings","sv":"Rädsla och oro","zh":"害怕和担心","ko":"무섭고 걱정되는 감정","feelings":["afraid","nervous","worried","shocked"]},{"id":"shy","emoji":"😳","color":"#FBB6D6","en":"Shy and embarrassed feelings","sv":"Blyg och generad","zh":"害羞和尴尬","ko":"수줍고 창피한 감정","feelings":["embarrassed","shy"]},{"id":"thinking","emoji":"🤔","color":"#35C86F","en":"Thinking feelings","sv":"Tänkande känslor","zh":"思考时的感受","ko":"생각할 때의 감정","feelings":["confused","interested","bored"]},{"id":"brave","emoji":"💪","color":"#FFC59E","en":"Brave and strong feelings","sv":"Modig och stark","zh":"勇敢和强壮","ko":"용감하고 강한 감정","feelings":["brave","strong","weak"]},{"id":"body","emoji":"🌡️","color":"#A8E6BC","en":"Body feelings","sv":"Kroppskänslor","zh":"身体的感受","ko":"몸의 느낌","feelings":["hot","cold","tired","sleepy","sick","hungry","thirsty","full"]}],"feelings":{"happy":{"emoji":"😀","en":"happy","sv":"glad","zh":"开心","ko":"행복한","tell":{"en":"I was happy.","sv":"Jag var glad.","zh":"我很开心。","ko":"나는 행복했다."},"show":{"en":"I grinned like a Cheshire cat and felt as light as a feather.","sv":"Jag flinade som Cheshirekatten och kände mig lätt som en fjäder.","zh":"我像柴郡猫一样咧嘴笑，觉得像羽毛一样轻松。","ko":"나는 체셔 고양이처럼 활짝 웃었고, 깃털처럼 마음이 가벼웠다."}},"excited":{"emoji":"🤩","en":"excited","sv":"uppspelt","zh":"兴奋","ko":"신나는","tell":{"en":"I was excited.","sv":"Jag var uppspelt.","zh":"我很兴奋。","ko":"나는 신났다."},"show":{"en":"I bounced like a rubber ball, and my heart was a race car.","sv":"Jag studsade som en gummiboll, och mitt hjärta var en racerbil.","zh":"我像橡皮球一样蹦来蹦去，我的心是一辆赛车。","ko":"나는 고무공처럼 통통 튀었고, 내 심장은 경주용 자동차였다."}},"playful":{"emoji":"🤪","en":"playful","sv":"lekfull","zh":"爱玩","ko":"장난스러운","tell":{"en":"My brother was playful.","sv":"Min bror var lekfull.","zh":"我弟弟很爱玩。","ko":"내 동생은 장난스러웠다."},"show":{"en":"My brother was as frisky as a puppy, bouncing off the walls all morning.","sv":"Min bror var pigg som en valp och studsade mot väggarna hela morgonen.","zh":"我弟弟像小狗一样活泼，一整个早上都在蹦来蹦去。","ko":"내 동생은 강아지처럼 활발해서 아침 내내 벽에 튕겨 다녔다."}},"proud":{"emoji":"🏅","en":"proud","sv":"stolt","zh":"自豪","ko":"자랑스러운","tell":{"en":"I was proud.","sv":"Jag var stolt.","zh":"我很自豪。","ko":"나는 자랑스러웠다."},"show":{"en":"I stood as tall as a tree, beaming like a lighthouse.","sv":"Jag stod rak som ett träd och strålade som en fyr.","zh":"我站得像大树一样挺拔，像灯塔一样闪闪发光。","ko":"나는 나무처럼 꼿꼿이 서서 등대처럼 환하게 빛났다."}},"lucky":{"emoji":"🍀","en":"lucky","sv":"tursam","zh":"幸运","ko":"운이 좋은","tell":{"en":"I was lucky.","sv":"Jag hade tur.","zh":"我很幸运。","ko":"나는 운이 좋았다."},"show":{"en":"Finding my lost ring was like finding a needle in a haystack.","sv":"Att hitta min borttappade ring var som att hitta en nål i en höstack.","zh":"找到我丢的戒指，就像在干草堆里找到一根针。","ko":"잃어버린 반지를 찾은 건 건초 더미에서 바늘을 찾은 것 같았다."}},"sad":{"emoji":"😢","en":"sad","sv":"ledsen","zh":"难过","ko":"슬픈","tell":{"en":"I was sad.","sv":"Jag var ledsen.","zh":"我很难过。","ko":"나는 슬펐다."},"show":{"en":"My heart sank like a stone, and a gray cloud followed me all day.","sv":"Mitt hjärta sjönk som en sten, och ett grått moln följde mig hela dagen.","zh":"我的心像石头一样沉下去，一朵灰色的云跟了我一整天。","ko":"내 마음은 돌처럼 가라앉았고, 회색 구름이 하루 종일 나를 따라다녔다."}},"lonely":{"emoji":"🏝️","en":"lonely","sv":"ensam","zh":"孤独","ko":"외로운","tell":{"en":"I was lonely.","sv":"Jag var ensam.","zh":"我很孤独。","ko":"나는 외로웠다."},"show":{"en":"At recess, I was an island, like the last leaf on a tree.","sv":"På rasten var jag en ö, som det sista lövet på ett träd.","zh":"课间休息时，我是一座孤岛，像树上的最后一片叶子。","ko":"쉬는 시간에 나는 섬이었다. 나무에 남은 마지막 잎새 같았다."}},"disappointed":{"emoji":"😞","en":"disappointed","sv":"besviken","zh":"失望","ko":"실망한","tell":{"en":"I was disappointed.","sv":"Jag var besviken.","zh":"我很失望。","ko":"나는 실망했다."},"show":{"en":"When the trip was canceled, I felt like a balloon losing its air.","sv":"När resan blev inställd kände jag mig som en ballong som tappar luften.","zh":"旅行取消的时候，我觉得自己像一只慢慢漏气的气球。","ko":"여행이 취소되었을 때 나는 바람 빠지는 풍선 같았다."}},"angry":{"emoji":"😡","en":"angry","sv":"arg","zh":"生气","ko":"화난","tell":{"en":"I was angry.","sv":"Jag var arg.","zh":"我很生气。","ko":"나는 화가 났다."},"show":{"en":"My face turned as red as a fire truck, and I boiled like a kettle.","sv":"Mitt ansikte blev rött som en brandbil, och jag kokade som en vattenkokare.","zh":"我的脸红得像消防车，像水壶一样沸腾起来。","ko":"내 얼굴은 소방차처럼 빨개졌고, 나는 주전자처럼 부글부글 끓었다."}},"frustrated":{"emoji":"😤","en":"frustrated","sv":"frustrerad","zh":"烦躁","ko":"답답한","tell":{"en":"I was frustrated.","sv":"Jag var frustrerad.","zh":"我很烦躁。","ko":"나는 답답했다."},"show":{"en":"The puzzle was a brick wall, and I felt like a hamster on a wheel.","sv":"Pusslet var en tegelvägg, och jag kände mig som en hamster i ett hjul.","zh":"这个谜题是一堵砖墙，我觉得自己像在轮子上跑的仓鼠。","ko":"그 퍼즐은 벽돌 벽이었고, 나는 쳇바퀴 위의 햄스터 같았다."}},"afraid":{"emoji":"😱","en":"afraid","sv":"rädd","zh":"害怕","ko":"겁먹은","tell":{"en":"I was scared.","sv":"Jag var rädd.","zh":"我很害怕。","ko":"나는 무서웠다."},"show":{"en":"I froze like a deer in headlights, and my blood turned to ice.","sv":"Jag frös som ett rådjur i strålkastarljuset, och mitt blod blev till is.","zh":"我像被车灯照到的小鹿一样僵住了，血都变成了冰。","ko":"나는 헤드라이트 앞의 사슴처럼 얼어붙었고, 피가 얼음으로 변했다."}},"nervous":{"emoji":"😬","en":"nervous","sv":"nervös","zh":"紧张","ko":"긴장한","tell":{"en":"I was nervous.","sv":"Jag var nervös.","zh":"我很紧张。","ko":"나는 긴장했다."},"show":{"en":"Before my speech, I had butterflies in my stomach and legs as wobbly as jelly.","sv":"Före mitt tal hade jag fjärilar i magen och ben darriga som gelé.","zh":"演讲前，我的肚子里好像有蝴蝶，腿软得像果冻。","ko":"발표 전에 배 속에 나비들이 날아다녔고, 다리는 젤리처럼 후들거렸다."}},"worried":{"emoji":"😟","en":"worried","sv":"orolig","zh":"担心","ko":"걱정하는","tell":{"en":"I was worried.","sv":"Jag var orolig.","zh":"我很担心。","ko":"나는 걱정됐다."},"show":{"en":"My thoughts spun like a top, and worry was a heavy backpack.","sv":"Tankarna snurrade som en snurra, och oron var en tung ryggsäck.","zh":"我的思绪像陀螺一样转个不停，担心是一个沉重的书包。","ko":"생각이 팽이처럼 빙빙 돌았고, 걱정은 무거운 책가방이었다."}},"shocked":{"emoji":"😲","en":"shocked","sv":"chockad","zh":"震惊","ko":"충격받은","tell":{"en":"I was shocked.","sv":"Jag var chockad.","zh":"我很震惊。","ko":"나는 충격을 받았다."},"show":{"en":"My eyes grew as big as saucers, and my mouth hung open like a fish.","sv":"Mina ögon blev stora som tefat, och munnen hängde öppen som på en fisk.","zh":"我的眼睛瞪得像碟子一样大，嘴巴张得像鱼一样。","ko":"내 눈은 접시만큼 커졌고, 입은 물고기처럼 떡 벌어졌다."}},"embarrassed":{"emoji":"😳","en":"embarrassed","sv":"generad","zh":"尴尬","ko":"창피한","tell":{"en":"I was embarrassed.","sv":"Jag var generad.","zh":"我很尴尬。","ko":"나는 창피했다."},"show":{"en":"When I tripped, my face turned as red as a tomato, and I felt as small as an ant.","sv":"När jag snubblade blev jag röd som en tomat och kände mig liten som en myra.","zh":"我绊倒的时候，脸红得像番茄，觉得自己像蚂蚁一样小。","ko":"넘어졌을 때 내 얼굴은 토마토처럼 빨개졌고, 개미처럼 작아진 기분이었다."}},"shy":{"emoji":"🙈","en":"shy","sv":"blyg","zh":"害羞","ko":"수줍은","tell":{"en":"She was shy.","sv":"Hon var blyg.","zh":"她很害羞。","ko":"그녀는 수줍었다."},"show":{"en":"On the first day, she was as quiet as a mouse, like a turtle hiding in its shell.","sv":"Första dagen var hon tyst som en mus, som en sköldpadda som gömmer sig i sitt skal.","zh":"第一天，她像老鼠一样安静，像缩进壳里的乌龟。","ko":"첫날 그녀는 생쥐처럼 조용했고, 등껍질 속에 숨은 거북이 같았다."}},"confused":{"emoji":"😕","en":"confused","sv":"förvirrad","zh":"困惑","ko":"헷갈리는","tell":{"en":"I was confused.","sv":"Jag var förvirrad.","zh":"我很困惑。","ko":"나는 헷갈렸다."},"show":{"en":"The directions were as clear as mud, and my head was a foggy morning.","sv":"Instruktionerna var klara som lera, och mitt huvud var en dimmig morgon.","zh":"这些指示像泥巴一样“清楚”，我的脑袋是一个起雾的早晨。" const SAMPLE_MIDIS = Object.keys(PIANO).map(Number).sort((a,b)=>a-b);

function audio(){

function loadPiano(){
  if(ready) return ready;
  ready = Promise.all(SAMPLE_MIDIS.map(m => new Promise(res => {

  const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = Math.pow(2,(m-s0)/12);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(vel*0.85, when+0.006);
  g.gain.setTargetAtTime(0, when+dur, release || 0.28);
  s.connect(g); g.connect(master); s.start(when); s.stop(when+dur+2);
  return {s,g};
}
function playFeeling(key){
  if(muted || !audio()) return;
  const piece = DATA.music[key]; if(!piece) return;
  stopAll();
  loadPiano().then(()=>{
    const t0 = ctx.currentTime + 0.04;
    piece.forEach(([t,notes,dur,vel]) => notes.forEach(m => { const v = note(m, t0+t, dur, vel); if(v) voices.push(v); }));
  });
}
function click(){ /* a short, light piano tap */
  if(muted || !audio()) return;
  loadPiano().then(()=>{ note(84, ctx.currentTime+0.005, 0.05, 0.32, 0.03); });
}
function warmup(){ if(audio()) loadPiano(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = (obj) => obj[lang] || obj.en;
const tr = (html) => lang === 'en' ? '' : `<div class="tr" lang="${lang}">${html}</div>`;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1400); }
const famOf = key => DATA.families.find(f => f.feelings.includes(key));

/* ---------- views ---------- */
function home(){
  const u = DATA.ui;
  let h = `<section class="intro">
    <div class="blk"><p class="big">🎯 ${esc(u.tagline.en)}</p>${tr(esc(t(u.tagline)))}
      <button class="btn surprise" id="surprise">🎲 Surprise me</button></div>
    <div class="blk def"><p>🔍 <b>Simile</b><br>${esc(u.simile_def.en)}</p>${tr(esc(t(u.simile_def)))}</div>
    <div class="blk def"><p>🪄 <b>Metaphor</b><br>${esc(u.metaphor_def.en)}</p>${tr(esc(t(u.metaphor_def)))}</div>
  </section>`;
  DATA.families.forEach(f => {
    h += `<section class="fam" style="--hover:${f.color}">
      <div class="tab" style="background:${f.color}">${f.emoji} ${esc(f.en)}${lang!=='en'?`<span class="trs" lang="${lang}">${esc(f[lang])}</span>`:''}</div>
      <div class="blk">`;
    f.feelings.forEach(k => {
      const F = DATA.feelings[k];
      h += `<button class="btn feel" data-feel="${k}"><span class="e" aria-hidden="true">${F.emoji}</span><span class="w">${esc(F.en)}</span>${lang!=='en'?`<span class="wt" lang="${lang}">${esc(F[lang])}</span>`:''}</button>`;
    });
    h += `</div></section>`;
  });
  return h;
}
function feeling(key){
  const F = DATA.feelings[key], fam = famOf(key), u = DATA.ui, items = DATA.items[key];
  const nS = items.filter(i=>i.type==='simile').length, nM = items.length - nS;
  let h = `<div class="top">
      <button class="btn" id="back">⬅️ All feelings</button>
      <button class="btn" id="replay" style="background:${fam.color}">🎹 Hear the feeling</button>
      <button class="btn surprise" id="surprise" style="margin:0">🎲 Surprise me</button>
    </div>
    <section class="blk hero" style="background:${fam.color}">
      <div class="e" aria-hidden="true">${F.emoji}</div>
      <div><div class="lead">${esc(u.youcanshow.en)}</div><h2>${esc(F.en)}</h2>
      ${lang!=='en'?`<div class="ht" lang="${lang}">${esc(t(u.youcanshow))} ${esc(F[lang])}</div>`:''}</div>
    </section>
    <section class="ts">
      <div class="blk tell"><div class="lab">❌ Telling</div><div class="line">${esc(F.tell.en)}</div>${tr(esc(F.tell[lang]||''))}</div>
      <div class="blk"><div class="lab">✅ Showing</div><div class="line">${esc(F.show.en)}</div>${tr(esc(F.show[lang]||''))}</div>
    </section>
    <div class="filters" role="group" aria-label="Filter">
      <button class="btn filt" data-f="all" aria-pressed="${filter==='all'}">⭐ All (${items.length})</button>
      <button class="btn filt" data-f="simile" aria-pressed="${filter==='simile'}">🔍 Similes (${nS})</button>
      <button class="btn filt" data-f="metaphor" aria-pressed="${filter==='metaphor'}">🪄 Metaphors (${nM})</button>
    </div>
    <section class="cards">`;
  items.forEach((it, i) => {
    if(filter !== 'all' && it.type !== filter) return;
    h += `<article class="blk card${i===flashIndex?' flash':''}" id="c${i}">
      <span class="chip ${it.type}">${it.type==='simile'?'🔍 Simile':'🪄 Metaphor'}</span>
      <button class="btn copy" data-copy="${esc(it.en)}" aria-label="Copy">📋</button>
      <p class="phrase">${esc(it.en)}</p>
      <div class="mean"><b>${esc(u.means.en)}:</b> ${esc(it.m.en)}</div>
      ${lang!=='en'?`<div class="tbox" lang="${lang}"><div class="tp">${esc(it.t[lang])}</div><div class="tm"><b>${esc(u.means[lang])}:</b> ${esc(it.m[lang])}</div></div>`:''}
    </article>`;
  });
  h += `</section>
    <section class="blk fresh"><p class="big">✨ ${esc(u.fresh.en)}</p>${tr(esc(t(u.fresh)))}</section>`;
  return h;
}

function current(){ const k = decodeURIComponent(location.hash.slice(1)); return DATA.feelings[k] ? k : null; }
function render(){
  const k = current();
  $('#app').innerHTML = k ? feeling(k) : home();
  document.title = k ? `Show, Don't Tell: ${DATA.feelings[k].en}` : "Show, Don't Tell";
  document.querySelectorAll('.lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  const s = $('#sound'); s.textContent = muted ? '🔇' : '🔊'; s.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  if(k && flashIndex >= 0){ const c = $('#c'+flashIndex); if(c) c.scrollIntoView({behavior:'smooth', block:'center'}); flashIndex = -1; }
}

/* ---------- events ---------- */
let warmed = false;
document.addEventListener('click', e => {
  const b = e.target.closest('button, a#home'); if(!b) return;
  if(!warmed){ warmed = true; setTimeout(warmup, 400); }
  if(b.dataset.feel){ filter = 'all'; playFeeling(b.dataset.feel); location.hash = b.dataset.feel; window.scrollTo(0,0); return; }
  if(b.id === 'replay'){ playFeeling(current()); return; }
  if(b.id === 'sound'){ muted = !muted; store.set('muted', muted?'1':'0'); if(muted) stopAll(); else click(); render(); return; }
  click();
  if(b.id === 'home'){ e.preventDefault(); stopAll(); location.hash = ''; return; }
  if(b.id === 'back'){ stopAll(); location.hash = ''; return; }
  if(b.dataset.lang){ lang = b.dataset.lang; store.set('lang', lang); document.documentElement.lang = 'en'; render(); return; }
  if(b.dataset.f){ filter = b.dataset.f; render(); return; }
  if(b.id === 'surprise'){
    const keys = Object.keys(DATA.items); const k = keys[Math.floor(Math.random()*keys.length)];
    filter = 'all'; flashIndex = Math.floor(Math.random()*DATA.items[k].length);
    if(current() === k) render(); else location.hash = k; return;
  }
  if(b.dataset.copy){
    const txt = b.dataset.copy;
    const done = () => toast('📋 Copied!');
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, ()=>toast('Select the words to copy them.')); }
    else toast('Select the words to copy them.');
  }
});
window.addEventListener('hashchange', () => { render(); if(!current()) window.scrollTo(0,0); });
render();
</script>
</body>
</html>
